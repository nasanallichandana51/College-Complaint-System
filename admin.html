<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h2>🎓 College Complaint Management System</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Student Dashboard</a>
    </nav>
</header>

<section class="admin-section">

    <div class="admin-card">

        <h1>👨‍💼 Admin Dashboard</h1>

        <h2>Complaint Details</h2>
        <div class="admin-summary">
    <div class="summary-box">
        <h3>📋 Total Complaints</h3>
        <p id="totalComplaints">0</p>
    </div>

    <div class="summary-box">
        <h3>⏳ Pending</h3>
        <p id="pendingComplaints">0</p>
    </div>

    <div class="summary-box">
        <h3>✅ Resolved</h3>
        <p id="resolvedComplaints">0</p>
    </div>
</div>

        <div id="adminComplaint">
            <!-- Complaint will appear here -->
        </div>

    </div>

</section>

<script>

const data = localStorage.getItem("complaint");

const complaintBox = document.getElementById("adminComplaint");

if (data) {

    const complaint = JSON.parse(data);

    complaintBox.innerHTML = `
        <p><strong>Student Name:</strong> ${complaint.studentName}</p>

        <p><strong>Category:</strong> ${complaint.category}</p>

        <p><strong>Title:</strong> ${complaint.title}</p>

        <p><strong>Department:</strong> ${complaint.department}</p>

        <p><strong>Description:</strong> ${complaint.description}</p>

        <p><strong>Priority:</strong> ${complaint.priority}</p>

        <label><strong>Update Status:</strong></label>

        <select id="status">
            <option>Pending</option>
            <option>In Progress</option>
            <option>Resolved</option>
        </select>

        <button onclick="updateStatus()">
            Update Status
        </button>
    `;

} else {

    complaintBox.innerHTML = `
        <p>No complaints available.</p>
    `;
}


function updateStatus() {

    const newStatus = document.getElementById("status").value;

    const complaint = JSON.parse(
        localStorage.getItem("complaint")
    );

    complaint.status = newStatus;

    localStorage.setItem(
        "complaint",
        JSON.stringify(complaint)
    );

    alert("Complaint status updated!");

    updateSummary();
}


function updateSummary() {

    const data = localStorage.getItem("complaint");

    if (data) {

        const complaint = JSON.parse(data);

        document.getElementById("totalComplaints").textContent = "1";

        if (complaint.status === "Pending") {
            document.getElementById("pendingComplaints").textContent = "1";
        } else {
            document.getElementById("pendingComplaints").textContent = "0";
        }

        if (complaint.status === "Resolved") {
            document.getElementById("resolvedComplaints").textContent = "1";
        } else {
            document.getElementById("resolvedComplaints").textContent = "0";
        }

    }
}


updateSummary();

</script>

</body>
</html>
